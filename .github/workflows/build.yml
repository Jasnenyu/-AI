name: Build Storyboard-Copilot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v0.1.0). Leave empty to skip release job.'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npx tauri build
      - name: Rename Windows installer
        shell: pwsh
        run: |
          $RELEASE_APP_NAME = "Storyboard-Copilot"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } elseif ("${{ github.event.inputs.release_tag }}" -like 'v*') {
            $VERSION = "${{ github.event.inputs.release_tag }}" -replace '^v', ''
          } else {
            $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          }
          $NSIS_PATH = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($NSIS_PATH) {
            $NEW_NAME = "${RELEASE_APP_NAME}_${VERSION}_x64-setup.exe"
            $NEW_PATH = Join-Path (Split-Path $NSIS_PATH.FullName) $NEW_NAME
            Move-Item -Path $NSIS_PATH.FullName -Destination $NEW_PATH -Force
            Write-Host "Renamed to: $NEW_NAME"
          } else {
            throw "No NSIS installer found"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm install
      - name: Build application
        env:
          CC: ""
          CXX: ""
        run: npx tauri build --target universal-apple-darwin
      - name: Rename macOS DMG
        run: |
          RELEASE_APP_NAME="Storyboard-Copilot"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            VERSION=${{ github.event.inputs.release_tag }}
            VERSION=${VERSION#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found"
            exit 1
          fi
          NEW_NAME="${RELEASE_APP_NAME}_${VERSION}_universal.dmg"
          mv "$DMG_PATH" "$(dirname "$DMG_PATH")/$NEW_NAME"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
